<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09090d">
  <meta name="description" content="Contact the GIPHY Search Engine team.">
  <title>Contact | GIPHY Search Engine</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav container" aria-label="Main navigation">
      <a class="brand" href="index.html" aria-label="GIPHY Search Engine home"><span class="brand-mark" aria-hidden="true">G</span><span>GIPHY <span class="brand-light">Search Engine</span></span></a>
      <div class="nav-links">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="trending.html">Trending</a>
        <a class="nav-link active" href="contact.html" aria-current="page">Contact</a>
      </div>
    </nav>
  </header>

  <main class="contact-page">
    <section class="contact-panel" aria-labelledby="contact-heading">
      <p class="eyebrow"><span class="eyebrow-dot"></span> WE’D LOVE TO HEAR FROM YOU</p>
      <h1 id="contact-heading">Get in touch</h1>
      <p class="contact-intro">Have a question or feedback? Leave us a message below.</p>

      <form class="contact-form" id="contact-form" novalidate>
        <div class="form-field">
          <label for="full-name">Full Name</label>
          <input id="full-name" name="name" type="text" autocomplete="name" required aria-describedby="name-error">
          <span class="field-error" id="name-error"></span>
        </div>
        <div class="form-field">
          <label for="email-address">Email Address</label>
          <input id="email-address" name="email" type="email" autocomplete="email" required aria-describedby="email-error">
          <span class="field-error" id="email-error"></span>
        </div>
        <div class="form-field">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="6" required aria-describedby="message-error"></textarea>
          <span class="field-error" id="message-error"></span>
        </div>
        <button class="contact-submit" type="submit">Send message <span aria-hidden="true">↗</span></button>
        <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <a class="brand footer-brand" href="index.html"><span class="brand-mark" aria-hidden="true">G</span><span>GIPHY <span class="brand-light">Search Engine</span></span></a>
      <p class="copyright">© 2026 GIPHY Search Engine. All rights reserved.</p>
      <nav class="footer-links" aria-label="Footer navigation"><a href="index.html">Home</a><a href="trending.html">Trending</a><a href="contact.html" aria-current="page">Contact</a></nav>
    </div>
  </footer>
  <script src="js/contact.js"></script>
</body>
</html>
