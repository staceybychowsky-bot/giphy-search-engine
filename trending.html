<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09090d">
  <meta name="description" content="Explore trending GIFs on GIPHY Search Engine.">
  <title>Trending GIFs | GIPHY Search Engine</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav container" aria-label="Main navigation">
      <a class="brand" href="index.html" aria-label="GIPHY Search Engine home"><span class="brand-mark" aria-hidden="true">G</span><span>GIPHY <span class="brand-light">Search Engine</span></span></a>
      <div class="nav-links">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link active" href="trending.html" aria-current="page">Trending</a>
        <a class="nav-link" href="contact.html">Contact</a>
      </div>
    </nav>
  </header>

  <main class="trending-section trending-page">
    <div class="container">
      <div class="section-heading">
        <div>
          <p class="eyebrow"><span class="eyebrow-dot"></span> THE INTERNET, IN MOTION</p>
          <h1 class="page-heading">Trending GIFs</h1>
          <p class="giphy-attribution">Powered by GIPHY</p>
        </div>
        <a class="text-link" href="index.html">Back to search <span aria-hidden="true">→</span></a>
      </div>
      <div class="gif-grid" id="results" aria-live="polite" aria-label="Trending GIFs" aria-busy="true">
        <div class="empty-state" role="status"><p>Loading trending GIFs…</p></div>
      </div>
    </div>
  </main>

  <dialog class="gif-modal" id="gif-modal" aria-labelledby="gif-modal-title">
    <div class="gif-modal-header">
      <h2 id="gif-modal-title">GIF details</h2>
      <button class="modal-close" id="modal-close" type="button" aria-label="Close GIF details">×</button>
    </div>
    <img class="modal-preview" id="modal-preview" alt="">
    <p class="modal-gif-title" id="modal-gif-title"></p>
    <div class="modal-actions">
      <button class="copy-gif-button" id="copy-gif-url" type="button">Copy GIF URL</button>
      <a class="open-giphy-link" id="open-on-giphy" href="#" target="_blank" rel="noopener noreferrer">Open on GIPHY <span aria-hidden="true">↗</span></a>
    </div>
    <p class="copy-status" id="copy-status" role="status" aria-live="polite"></p>
  </dialog>

  <footer class="site-footer">
    <div class="container footer-inner">
      <a class="brand footer-brand" href="index.html"><span class="brand-mark" aria-hidden="true">G</span><span>GIPHY <span class="brand-light">Search Engine</span></span></a>
      <p class="copyright">© 2026 GIPHY Search Engine. All rights reserved.</p>
      <nav class="footer-links" aria-label="Footer navigation"><a href="index.html">Home</a><a href="trending.html" aria-current="page">Trending</a><a href="contact.html">Contact</a></nav>
    </div>
  </footer>
  <script src="js/app.js"></script>
</body>
</html>
